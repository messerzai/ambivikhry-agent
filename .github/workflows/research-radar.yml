name: Twice-daily research radar

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ambivikhry-research-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect recent research metadata
        run: python scripts/research_radar.py
      - name: Publish report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ambivikhry-research-radar-${{ github.run_number }}
          path: research-radar.md
          if-no-files-found: error
          retention-days: 14
