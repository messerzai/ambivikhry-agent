[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambivikhry-agent"
version = "2.15.0"
description = "Ambivikhry / Quinn-Vortex self-revising, tool-using agent runtime"
requires-python = ">=3.10"
license = {text = "Ambivikhry Proprietary License v1.0"}

[project.scripts]
ambivikhry-demo = "ambivikhry.demo:main"

[tool.setuptools.packages.find]
include = ["ambivikhry*"]
