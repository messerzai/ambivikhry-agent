[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambivikhry-agent"
version = "2.6.1"
description = "Ambivikhry / Quinn-Vortex self-revising, tool-using agent runtime"
requires-python = ">=3.10"
license = "CC0-1.0"

[tool.setuptools.packages.find]
include = ["ambivikhry*"]
exclude = ["experiments*"]

[project.scripts]
ambivikhry-demo = "ambivikhry.demo:main"
